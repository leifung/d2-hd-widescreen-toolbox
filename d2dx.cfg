# ============================================================
# D2DX configuration - Diablo II HD widescreen setup
# Keep this file in the Diablo II folder, next to glide3x.dll
# ============================================================

[window]
scale=1.0
position=[-1,-1]
frameless=false

[game]
# [-1,-1] = let D2DX pick a suitable widescreen resolution
size=[-1,-1]
# 0 = high quality filtering (sharp, recommended)
# 1 = bilinear (blurry)
# 2 = catmull-rom (higher quality than bilinear)
# 3 = nearest neighbour (sharp, pixelated)
# 4 = rasterize the game at the target resolution
filtering=0
bilinear-sharpness=2.0

# ============================================================
# Opt-outs from default D2DX behavior (all defaults shown)
# ============================================================
[optouts]
noclipcursor=false       # lock mouse cursor to the game window
nofpsmod=false           # false = load d2fps (high fps / motion prediction)
noresmod=false           # false = apply the built-in resolution mod (widescreen)
nowide=false             # false = choose a widescreen resolution
nologo=false             # true = hide the D2DX logo on the title screen
novsync=true             # true = use frame limiter instead of vsync
noframetearing=true      # true = prevent frame tearing
noaa=false               # false = apply anti-aliasing to jagged edges
nocompatmodefix=false    # false = block "Windows XP compatibility mode"
notitlechange=false      # false = change the window title text
nokeepaspectratio=false  # false = KEEP ASPECT RATIO when drawing to screen (no stretch)
